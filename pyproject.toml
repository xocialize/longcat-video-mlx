[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longcat-video-mlx"
version = "0.1.0.dev0"
description = "Apple MLX port of LongCat-Video (text-to-video, image-to-video, video continuation, long video, interactive)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "xocialize" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mlx>=0.31.0",
    "mlx-arsenal>=0.10",
    "safetensors>=0.4",
    "huggingface_hub>=0.34",
    "numpy>=1.26",
    "Pillow>=10",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# PyTorch is a DEV-ONLY dep for parity tests. End users on MLX never need it.
parity = [
    "torch>=2.2",
    "transformers>=4.48",
    "diffusers>=0.33",
    "einops>=0.8",
]
dev = [
    "longcat-video-mlx[parity]",
    "pytest>=8",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/xocialize/longcat-video-mlx"
Reference = "https://github.com/meituan-longcat/LongCat-Video"
Companion = "https://github.com/xocialize/longcat-avatar-mlx"

[tool.setuptools]
packages = ["longcat_video", "longcat_video.models"]

[tool.ruff]
line-length = 110
target-version = "py312"
